
name: Build Khoms APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'khoms_app_source(1).zip'
      - '.github/workflows/build-from-archive.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded project archive
        run: |
          set -e
          test -s 'khoms_app_source(1).zip'
          unzip -q 'khoms_app_source(1).zip' -d extracted-source
          test -d extracted-source/khoms_app
          cp -a extracted-source/khoms_app/. .
          rm -rf extracted-source desktop/__pycache__

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source and run regression tests
        run: npm run verify

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khoms-android-debug-v2.34
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
