name: Build Khoms Android APK and Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'khoms-v2.38.20-source.zip'
      - '.github/workflows/build-from-archive.yml'
permissions:
  contents: read
env:
  SOURCE_ARCHIVE: 'khoms-v2.38.20-source.zip'
jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: |
          set -euo pipefail
          test -s "$SOURCE_ARCHIVE"
          unzip -q "$SOURCE_ARCHIVE" -d extracted-source
          test -f extracted-source/khoms_app/android/app/build.gradle
          cp -a extracted-source/khoms_app/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: npm run verify
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon -p android clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: khoms-android-debug-v2.38.20
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        shell: pwsh
        run: |
          $archive = $env:SOURCE_ARCHIVE
          if (!(Test-Path $archive)) { throw "Missing source archive: $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath extracted-source -Force
          $src = Join-Path (Get-Location) 'extracted-source/khoms_app'
          if (!(Test-Path (Join-Path $src 'package.json'))) { throw 'khoms_app folder is missing in archive' }
          Get-ChildItem -LiteralPath $src -Force | Copy-Item -Destination (Get-Location) -Recurse -Force
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: npm run verify
      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows packages
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: khoms-windows-v2.38.20
          path: dist/*
          if-no-files-found: error
          retention-days: 30
